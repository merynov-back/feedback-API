[pytest]
asyncio_mode = auto        # все async тесты запускаются автоматически
testpaths = tests          # pytest ищет тесты только в папке tests/
python_files = test_*.py   # файлы тестов начинаются с test_
python_classes = Test*     # классы тестов начинаются с Test
python_functions = test_*  # функции тестов начинаются с test_

